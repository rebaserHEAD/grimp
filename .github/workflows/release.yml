name: Release

# Push a version tag (e.g. v1.0.0) to build Windows + Linux artifacts and
# assemble them into a draft GitHub Release. workflow_dispatch builds the
# same artifacts without publishing, for testing the pipeline off a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: windows
          - os: ubuntu-latest
            platform: linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Platform-agnostic SPA build (base './' for the packaged app://).
      - name: Build web app
        run: npm run build:electron

      # Package for this runner's OS. --publish never keeps electron-builder
      # from touching GitHub; the release job below does the publishing.
      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    # Only cut a release for tag pushes, not manual test runs.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Pull this version's section out of CHANGELOG.md for the release body.
      # Falls back to a compare link if the section is missing (i.e. the
      # changelog wasn't rolled over before tagging).
      - name: Build release body from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { insec = index($0, "[" ver "]") > 0; next }
            insec { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' > section.md

          {
            echo '> ⚠️ **Windows: this build is not code-signed yet.** SmartScreen will show'
            echo '> "Windows protected your PC" on first run. Click **More info → Run anyway**.'
            echo '> Signing is in progress and will remove this step in a future release.'
            echo ''
            if [ -s section.md ]; then
              cat section.md
            else
              echo "_No changelog section found for ${VERSION}; see the full changelog._"
            fi
            echo ''
            echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          } > body.md

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          body_path: body.md
